name: Release

# Builds the Windows installer and publishes it as a GitHub release.
# Installed copies of The Cube Timer update from the latest release.
# Runs by itself whenever package.json changes on main with a version that has no release yet
# (and can still be started by hand from the Actions tab).
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this version new?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$v already released, skipping"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ver.outputs.new == 'true'
      - name: Build and publish installer
        if: steps.ver.outputs.new == 'true'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
